<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Record Data</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .master-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: rgba(56, 189, 248, 0.08);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      font-size: 13px;
      color: var(--text-muted, #94a3b8);
    }

    .master-status-bar .row-count {
      color: var(--accent-blue, #38bdf8);
      font-weight: 700;
    }

    .master-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted, #94a3b8);
      font-size: 16px;
    }

    .master-loading .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #1e293b;
      border-top: 4px solid var(--accent-blue, #38bdf8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #master-data-table th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0d1221;
      padding: 10px 12px;
      border: 1px solid rgba(56, 189, 248, 0.15);
      text-transform: uppercase;
      font-size: 11px;
      color: var(--accent-blue, #38bdf8);
      letter-spacing: 0.5px;
    }

    #master-data-table td {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 13px;
    }

    #master-data-table tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.02);
    }

    #master-data-table tr:hover td {
      background: rgba(56, 189, 248, 0.07);
    }

    .showAllActive {
      background: var(--accent-blue, #38bdf8) !important;
      color: #000 !important;
    }
  </style>
</head>

<body>
  <div id="app-shell">
    <header class="header">
      <div class="header-left">
        <div class="logo">MASTER RECORD</div>
      </div>
      <div class="header-right">
        <span id="master-date-label" style="font-size:13px; color:var(--text-muted,#94a3b8);"></span>
        <button id="backBtn" class="header-icon-btn" title="Back" onclick="window.location.href='index.html'">←</button>
        <button id="showAllBtn" class="header-icon-btn" title="Show All Data" onclick="toggleMasterAll()">☰ All</button>
      </div>
    </header>
    <div class="master-status-bar">
      <span id="master-source-info">Loading data...</span>
      <span>Total Rows: <span class="row-count" id="master-row-count">—</span></span>
    </div>
    <main style="padding:0; overflow:hidden; display:block; height:calc(100vh - 120px);">
      <div style="overflow:auto; height:100%; padding:0 0 20px 0;">
        <div id="master-loading" class="master-loading">
          <div class="spinner"></div>
          Fetching Master Record data...
        </div>
        <table class="master-table" id="master-data-table"
          style="width:100%; border-collapse:collapse; color:white; display:none;">
          <thead>
            <tr id="master-data-head"></tr>
          </thead>
          <tbody id="master-data-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // ── Master Record Page Logic ──────────────────────────────────────────────
    // masterShowAll = false → fetch with today's date (filtered)
    // masterShowAll = true  → fetch without date filter (ALL rows from Master Record sheet)
    let masterShowAll = false;

    // Use URL from app.js config if available, otherwise fallback
    const SCRIPT_URL = (typeof CONFIG !== 'undefined' && CONFIG.SCRIPT_URL) 
                       ? CONFIG.SCRIPT_URL 
                       : 'https://script.google.com/macros/s/AKfycbxIewqsIP4ibjYe_AmOqbVcccFm_hnQOD2T2l4a1gf8ghHAqQupFFwss3T73ZJuQTSM/exec';

    function buildMasterUrl(showAll) {
      const baseUrl = SCRIPT_URL;
      if (showAll) {
        return `${baseUrl}?sheet=Master Record`;
      } else {
        const today = new Date().toISOString().split('T')[0];
        return `${baseUrl}?sheet=Master Record&date=${today}&shift=Day`;
      }
    }

    function loadMasterData() {
      const url = buildMasterUrl(masterShowAll);
      const loadingEl = document.getElementById('master-loading');
      const tableEl = document.getElementById('master-data-table');
      const srcInfo = document.getElementById('master-source-info');
      const dateLabel = document.getElementById('master-date-label');

      loadingEl.style.display = 'block';
      tableEl.style.display = 'none';
      srcInfo.textContent = 'Connecting to Server...';

      const today = new Date().toISOString().split('T')[0];
      dateLabel.textContent = masterShowAll ? 'Showing: All History' : `Showing: ${today}`;

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`Server Error: ${res.status}`);
          return res.json();
        })
        .then(data => {
          if (data.error) throw new Error(data.error);
          const rows = data.rawData || [];
          srcInfo.textContent = `Source: ${data.debug?.sourceUsed || 'Master Record'} | Records: ${rows.length}`;
          renderMasterDataTable(rows);
        })
        .catch(err => {
          loadingEl.innerHTML = `<div style="color:#ef4444; padding:20px;">
            <p>❌ <b>Connection Error</b></p>
            <p style="font-size:12px;">${err.message}</p>
            <button onclick="loadMasterData()" style="margin-top:10px; padding:5px 15px; cursor:pointer;">Retry</button>
          </div>`;
          console.error('Master Load Error:', err);
        });
    }

    function renderMasterDataTable(rows) {
      const headEl = document.getElementById('master-data-head');
      const bodyEl = document.getElementById('master-data-body');
      const loadingEl = document.getElementById('master-loading');
      const tableEl = document.getElementById('master-data-table');
      const countEl = document.getElementById('master-row-count');

      countEl.textContent = rows.length;

      if (rows.length === 0) {
        loadingEl.innerHTML = '<p style="color:#f59e0b; padding:20px;">⚠️ No records found for this date.</p>';
        return;
      }

      const headers = Object.keys(rows[0]);
      headEl.innerHTML = headers.map(h => `<th>${h}</th>`).join('');
      bodyEl.innerHTML = rows.map(row => 
        `<tr>${headers.map(h => `<td>${row[h] !== undefined ? row[h] : ''}</td>`).join('')}</tr>`
      ).join('');

      loadingEl.style.display = 'none';
      tableEl.style.display = 'table';
    }

    function toggleMasterAll() {
      masterShowAll = !masterShowAll;
      const btn = document.getElementById('showAllBtn');
      if (masterShowAll) {
        btn.textContent = '✕ Today';
        btn.classList.add('showAllActive');
      } else {
        btn.textContent = '☰ All';
        btn.classList.remove('showAllActive');
      }
      loadMasterData();
    }

    loadMasterData();
  </script>
</body>

</html>
